<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agenda de la barberia</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span id="brandLogo" class="brand-logo" hidden></span>
        <span class="pole" aria-hidden="true"><span></span><span></span><span></span></span>
        <div class="brand-text">
          <h1 id="shopName">Mi Barberia</h1>
          <p id="barberSub" class="brand-sub">Barbero</p>
        </div>
      </div>
      <nav class="tabs" role="tablist">
        <button class="tab-btn active" data-tab="booking" role="tab" aria-selected="true">Reservar</button>
        <button class="tab-btn" data-tab="panel" role="tab" aria-selected="false">Panel del barbero</button>
      </nav>
    </header>

    <main id="view-booking" class="view">
      <div class="booking-layout">
      <section class="stepper-shell">
        <ol class="steps" id="stepIndicator">
          <li data-step="1" class="active"><span>1</span>Servicio</li>
          <li data-step="2"><span>2</span>Fecha</li>
          <li data-step="3"><span>3</span>Hora</li>
          <li data-step="4"><span>4</span>Tus datos</li>
        </ol>

        <div class="ticket">
          <div class="ticket-body">

            <div class="step-panel" data-step-panel="1">
              <h2>Elige el servicio</h2>
              <div id="serviceList" class="service-grid" aria-live="polite"></div>
            </div>

            <div class="step-panel" data-step-panel="2" hidden>
              <h2>Elige el dia</h2>
              <div class="selected-service" id="chosenServiceLine"></div>
              <div id="dateStrip" class="date-strip" aria-live="polite"></div>
              <button class="link-back" data-back="1">&larr; Cambiar servicio</button>
            </div>

            <div class="step-panel" data-step-panel="3" hidden>
              <h2>Elige la hora</h2>
              <div class="selected-service" id="chosenDateLine"></div>
              <div id="slotList" class="slot-list-wrap" aria-live="polite"></div>
              <button class="link-back" data-back="2">&larr; Cambiar dia</button>
            </div>

            <div class="step-panel" data-step-panel="4" hidden>
              <h2>Tus datos</h2>
              <div class="selected-service" id="chosenTimeLine"></div>
              <form id="bookingForm" class="booking-form">
                <label>
                  Nombre completo
                  <input type="text" name="clientName" required autocomplete="name" placeholder="Ej: Camila Rios" />
                </label>
                <label>
                  Numero de whatsapp / telefono
                  <input type="tel" name="clientPhone" required autocomplete="tel" placeholder="Ej: 3001234567" />
                </label>
                <button type="submit" class="btn-primary">Confirmar reserva</button>
                <p class="form-error" id="bookingError" hidden></p>
              </form>
              <button class="link-back" data-back="3">&larr; Cambiar hora</button>
            </div>

            <div class="step-panel" data-step-panel="confirm" hidden>
              <div class="confirm-head">
                <span class="check">&#10003;</span>
                <h2>Reserva confirmada</h2>
              </div>
              <div class="stub" id="confirmStub"></div>
              <button class="btn-secondary" id="bookAnotherBtn">Reservar otra cita</button>
            </div>

          </div>
        </div>
      </section>

      <aside class="booking-sidebar" id="bookingSidebar">
        <div class="sidebar-card">
          <h3 id="sidebarShopName">Mi Barberia</h3>
          <p class="sidebar-desc" id="sidebarDescription" hidden></p>
          <div class="sidebar-section" id="sidebarHoursSection">
            <h4>Horario</h4>
            <ul class="sidebar-hours-list" id="sidebarHoursList"></ul>
          </div>
          <div class="sidebar-section" id="sidebarContactSection" hidden>
            <h4>Contacto</h4>
            <ul class="sidebar-contact-list" id="sidebarContactList"></ul>
          </div>
        </div>
      </aside>
      </div>

      <section class="my-bookings">
        <button class="link-toggle" id="toggleMyBookings">Mis reservas &darr;</button>
        <div id="myBookingsList" class="my-bookings-list" hidden></div>
      </section>
    </main>

    <main id="view-panel" class="view" hidden>

      <div id="loginBox" class="login-box">
        <h2>Panel del barbero</h2>
        <p class="muted">Acceso privado. Ingresa la contrasena del panel para ver la agenda.</p>
        <form id="loginForm" class="login-form">
          <label>
            Contrasena
            <input type="password" name="password" required autocomplete="current-password" />
          </label>
          <button type="submit" class="btn-primary">Entrar</button>
          <p class="form-error" id="loginError" hidden></p>
        </form>
      </div>

      <div id="dashboard" class="dashboard" hidden>
        <div class="panel-shell">
          <nav class="panel-nav" id="panelNav">
            <button class="panel-nav-toggle" id="panelNavToggle" type="button" aria-expanded="false">
              <span>&#9776; <span id="panelNavCurrentLabel">Inicio</span></span>
            </button>
            <div class="panel-nav-list" id="panelNavList">
              <button class="panel-nav-btn active" data-subtab="inicio" data-label="Inicio">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9.5v-6h5v6h3a1 1 0 0 0 1-1v-9"/></svg>
                Inicio
              </button>
              <button class="panel-nav-btn" data-subtab="agenda" data-label="Agenda">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
                Agenda
              </button>
              <button class="panel-nav-btn" data-subtab="clientes" data-label="Clientes">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.3 20c.4-3.3 2.8-5.3 5.7-5.3s5.3 2 5.7 5.3"/><circle cx="17" cy="8.5" r="2.3"/><path d="M15.8 14.8c2.3.3 4 1.9 4.4 4.9"/></svg>
                Clientes
              </button>
              <button class="panel-nav-btn" data-subtab="servicios" data-label="Servicios">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.6"/><circle cx="6" cy="18" r="2.6"/><path d="M20.5 4.5 8 15.5M9.5 12.5l11 6"/></svg>
                Servicios
              </button>
              <button class="panel-nav-btn" data-subtab="horarios" data-label="Horarios">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2.5"/></svg>
                Horarios
              </button>
              <button class="panel-nav-btn" data-subtab="estadisticas" data-label="Estadisticas">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V11M12 20V4M20 20v-7"/><path d="M2.5 20h19"/></svg>
                Estadisticas
              </button>
              <button class="panel-nav-btn" data-subtab="configuracion" data-label="Configuracion">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2.8"/><path d="M19.4 14.5a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.9l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.9-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.9 2.9l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.5 1z"/></svg>
                Configuracion
              </button>
              <div class="panel-nav-divider"></div>
              <button class="panel-nav-btn logout" id="logoutBtn">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 21H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.5"/><path d="M16 16.5 21 12l-5-4.5"/><path d="M21 12H9.5"/></svg>
                Cerrar sesion
              </button>
            </div>
          </nav>

          <div class="panel-content">
            <div class="stat-row" id="statRow"></div>
            <section class="subview" data-subview="inicio"></section>
            <section class="subview" data-subview="agenda" hidden></section>
            <section class="subview" data-subview="clientes" hidden></section>
            <section class="subview" data-subview="servicios" hidden></section>
            <section class="subview" data-subview="horarios" hidden></section>
            <section class="subview" data-subview="estadisticas" hidden></section>
            <section class="subview" data-subview="configuracion" hidden></section>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
